[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  external_node_modules = ["express", "serverless-http", "helmet", "express-rate-limit", "multer", "sharp"]
  node_bundler = "esbuild"
  included_files = ["assets/**", "data/mahek.sqlite"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*.json"
  to = "/404.html"
  status = 404
  force = true
